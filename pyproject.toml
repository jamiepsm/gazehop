[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gazehop"
dynamic = ["version"]     # from gazehop/__init__.py: the one place to change it
description = "Keyboard focus follows your eyes, with an ordinary webcam (Linux + Windows)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-contrib-python", "mediapipe", "pynput", "pystray", "pillow"]

[project.scripts]
gazehop = "gazehop.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "gazehop.__version__" }

[tool.setuptools]
packages = ["gazehop", "gazehop.backends"]

[tool.setuptools.package-data]
gazehop = ["assets/*"]
