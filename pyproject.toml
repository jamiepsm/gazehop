[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gazehop"
version = "0.2.0"
description = "Keyboard focus follows your eyes, with an ordinary webcam (Linux + Windows)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-contrib-python", "mediapipe", "pynput", "pystray", "pillow"]

[project.scripts]
gazehop = "gazehop.__main__:main"

[tool.setuptools]
packages = ["gazehop", "gazehop.backends"]

[tool.setuptools.package-data]
gazehop = ["assets/*"]
